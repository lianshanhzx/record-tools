<!DOCTYPE html>
<html>
<head>
    <title>TY 录制工具</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <span class="logo">TY-record-tools</span>
            <div class="header-actions">
                <span class="header-badge" id="recordCount">0 条</span>
                <button type="button" id="settingsBtn" class="settings-btn" aria-label="打开配置" title="配置">设置</button>
            </div>
        </div>

        <!-- Recording Controls -->
        <div class="record-bar" id="recordBar">
            <!-- <span class="record-logo">录</span> -->
            <button id="recordStartBtn" class="record-btn start">开始录制</button>
            <button id="recordStopBtn" class="record-btn stop" style="display:none">终止录制</button>
            <button id="recordPauseBtn" class="record-btn pause" style="display:none">暂停录制</button>
            <button id="recordContinueBtn" class="record-btn continue" style="display:none">继续录制</button>
        </div>

        <!-- Auto Fill (collapsible, above list) -->
        <div class="fill-bar" id="fillBar">
            <span class="fill-bar-title">智能自动填表</span>
            <span class="fill-bar-sub">输入一句话，自动填写 Element UI 表单</span>
            <span class="arrow" id="fillToggleArrow">▾</span>
        </div>
        <div class="fill-body" id="fillBody">
            <div class="fill-input-row">
                <textarea id="fillInstruction" placeholder='输入指令，如：随机填写个人信息 或 姓名填张三，手机号自动生成' rows="3"></textarea>
                <button id="executeFillBtn">执行</button>
            </div>
            <div class="fill-summary" id="fillSummary"></div>
            <div class="fill-log" id="fillLog">
                <div class="fill-log-empty">等待操作...</div>
            </div>
        </div>

        <!-- Record List -->
        <div class="list-header">
            <span>操作列表</span>
            <span class="scan-status" id="scanStatus" aria-live="polite"></span>
        </div>
        <div class="list-head-row">
            <span class="col-seq">序号</span>
            <span class="col-cmd">事件类型</span>
            <span class="col-name">业务对象名称</span>
            <span class="col-target">Target</span>
            <span class="col-val">Object Value</span>
            <span class="col-actions">操作</span>
        </div>
        <div class="list-body" id="listBody"></div>

        <!-- Edit & Actions -->
        <div class="edit-area">
            <div class="edit-row">
                <span class="edit-label">事件类型</span>
                <select id="editCmd"><option value="click">点击</option><option value="input">输入</option><option value="select:click">下拉框选择</option><option value="select:tree">树形选择</option><option value="radio">单选</option><option value="date">日期</option></select>
                <button id="saveCmdBtn">更改</button>
                <button id="deleteCmdBtn" class="danger">删除</button>
            </div>
            <div class="edit-row">
                <span class="edit-label">业务对象名称</span>
                <input id="editName" type="text">
                <button id="saveNameBtn">更改</button>
            </div>
            <div class="edit-row">
                <span class="edit-label">Object Value</span>
                <input id="editVal" type="text">
                <button id="saveValBtn">更改</button>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="actions-bar">
            <button id="clearBtn">重录</button>
            <button id="downloadJsonBtn">下载 JSON</button>
            <button id="downloadTxtBtn">下载 TXT</button>
            <!-- <button id="downloadAllElementsBtn">下载扫描元素</button> -->
            <button id="submitBtn" class="primary">提交</button>
        </div>
    </div>

    <div id="screenshotDialog" class="screenshot-dialog" aria-hidden="true">
        <div class="screenshot-dialog-panel">
            <div class="screenshot-dialog-header">
                <strong id="screenshotDialogTitle">分组截图</strong>
                <button type="button" id="closeScreenshotDialog">关闭</button>
            </div>
            <div id="screenshotDialogBody" class="screenshot-dialog-body"></div>
        </div>
    </div>

    <div id="screenshotPreview" class="screenshot-preview" aria-hidden="true">
        <button type="button" id="closeScreenshotPreview">关闭预览</button>
        <div class="screenshot-preview-body"><img id="screenshotPreviewImage" alt="截图预览"></div>
    </div>

    <div id="settingsDialog" class="settings-dialog" aria-hidden="true">
        <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
            <div class="settings-header">
                <strong id="settingsTitle">配置</strong>
                <button type="button" id="closeSettingsBtn" class="settings-close" aria-label="关闭配置">关闭</button>
            </div>
            <div class="settings-body">
                <section class="settings-section">
                    <h2>智能自动填表</h2>
                    <p>用于调用兼容 Chat Completions 的 LLM 服务。</p>
                    <label for="settingsApiKey">API Key</label>
                    <input type="password" id="settingsApiKey" placeholder="sk-..." autocomplete="off">
                    <label for="settingsBaseUrl">API 地址</label>
                    <input type="url" id="settingsBaseUrl" placeholder="https://api.example.com/v1">
                    <label for="settingsModel">模型</label>
                    <input type="text" id="settingsModel" placeholder="deepseek-v4-flash">
                </section>
                <section class="settings-section">
                    <h2>截图</h2>
                    <p>下载目录只能填写浏览器下载目录下的相对路径。</p>
                    <label for="settingsScreenshotDirectory">下载子目录</label>
                    <input type="text" id="settingsScreenshotDirectory" placeholder="TY-record-tools/screenshots">
                    <label for="settingsScreenshotMaxPixels">最大像素数</label>
                    <input type="number" id="settingsScreenshotMaxPixels" min="1" step="1">
                </section>
                <section class="settings-section">
                    <h2>上传服务</h2>
                    <p>用于上传全页截图的服务地址。</p>
                    <label for="settingsUploadBaseUrl">服务地址</label>
                    <input type="url" id="settingsUploadBaseUrl" placeholder="http://example.com:11002">
                </section>
            </div>
            <div class="settings-footer">
                <span id="settingsStatus" class="config-msg" aria-live="polite"></span>
                <button type="button" id="saveSettingsBtn" class="settings-save">保存配置</button>
            </div>
        </div>
    </div>
</body>
<script src="../config/config.js"></script>
<script src="../libs/jquery.js"></script>
<script src="../libs/utils.js"></script>
<script src="../libs/elementGrouper.js"></script>
<script src="./recordManager.js"></script>
<script src="./settings.js"></script>
<script src="./autoFill.js"></script>
<script src="./uploadService.js"></script>
<script src="./screenshotService.js"></script>
<script src="./index.js"></script>
</html>
