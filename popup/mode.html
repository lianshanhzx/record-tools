<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TY 工具选择</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
    }
    .panel {
      width: 260px;
      padding: 20px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 16px;
      color: #333;
      text-align: center;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .9; }
    .btn-record { background: #1a73e8; }
    .btn-collect { background: #d93025; }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="title">请选择要使用的工具</div>
    <button class="btn btn-record" id="recordBtn" type="button">录制工具</button>
    <button class="btn btn-collect" id="collectBtn" type="button">采集工具</button>
    <div class="status" id="status"></div>
  </div>
  <script src="mode.js"></script>
</body>
</html>
