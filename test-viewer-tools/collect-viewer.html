<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>采集信息查看器</title>
<style>
  :root {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --border: #e8eaed;
    --border-strong: #d0d5dd;
    --text: #1f2a3a;
    --text-dim: #5f6b7a;
    --text-faint: #8090a8;
    --accent: #1a73e8;
    --accent-dark: #1557b0;
    --accent-soft: #e8f0fe;
    --green: #1e7e34;
    --green-soft: #e6f4ea;
    --red: #c5221f;
    --red-soft: #fce8e6;
    --amber: #b26a00;
    --amber-soft: #fdf0e5;
    --purple: #6a3fd4;
    --purple-soft: #efe9ff;
    --cyan: #0e7c8a;
    --cyan-soft: #e2f4f7;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
    font-size: 13px; color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ===== Header ===== */
  .header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: linear-gradient(135deg, #1a73e8, #1557b0); color: #fff;
    flex: 0 0 auto; z-index: 20;
  }
  .logo { font-weight: 700; font-size: 15px; letter-spacing: .5px; white-space: nowrap; }
  .search {
    margin-left: auto; flex: 1; min-width: 120px; max-width: 420px;
    border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.15); color: #fff;
    border-radius: 6px; padding: 6px 10px; font-size: 12.5px; outline: none;
  }
  .search::placeholder { color: rgba(255,255,255,.75); }
  .search:focus { background: #fff; color: var(--text); border-color: #fff; }
  .search:focus::placeholder { color: #9aa0a6; }
  .search:disabled { opacity: .5; cursor: not-allowed; }
  .hbtn {
    border: 1px solid rgba(255,255,255,.55); background: transparent; color: #fff;
    border-radius: 6px; padding: 6px 11px; font-size: 12.5px; white-space: nowrap;
  }
  .hbtn:hover { background: rgba(255,255,255,.16); }
  .hbtn.primary { background: #fff; color: var(--accent); border-color: #fff; font-weight: 600; }
  .hbtn.primary:hover { background: #eef4ff; }
  .hbtn:disabled { opacity: .4; cursor: not-allowed; }
  .hbtn:disabled:hover { background: transparent; }

  /* ===== Summary ===== */
  .summary {
    display: none; align-items: center; flex-wrap: wrap; gap: 6px 14px;
    padding: 8px 16px; background: #fafbfc; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim); flex: 0 0 auto;
  }
  .summary.show { display: flex; }
  .summary .item { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .summary .url { font-family: var(--mono); color: var(--text); max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .summary b { color: var(--text); font-weight: 650; }
  .badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; }
  .badge.pass { background: var(--green-soft); color: var(--green); }
  .badge.fail { background: var(--red-soft); color: var(--red); }
  .badge.interrupted { background: var(--amber-soft); color: var(--amber); }
  .badge.neutral { background: #eef1f4; color: var(--text-dim); }

  /* ===== File tabs ===== */
  .filetabs {
    display: flex; align-items: stretch; gap: 2px; padding: 0 10px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    overflow-x: auto; flex: 0 0 auto;
  }
  .filetabs:empty { display: none; }
  .filetab {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px;
    border: none; background: transparent; color: var(--text-dim); font-size: 12.5px;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .filetab:hover { color: var(--text); }
  .filetab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .filetab .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .filetab .close {
    width: 16px; height: 16px; line-height: 1; border: none; background: transparent;
    color: var(--text-faint); border-radius: 4px; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .filetab .close:hover { background: var(--red-soft); color: var(--red); }

  /* ===== Main / empty ===== */
  main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--panel); }
  .empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--text-dim); padding: 24px;
  }
  .empty .big { font-size: 46px; opacity: .35; }
  .empty h2 { font-size: 16px; color: var(--text); font-weight: 600; }
  .empty p { font-size: 13px; max-width: 500px; text-align: center; line-height: 1.7; }
  .empty code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12px; }
  .error-banner {
    display: none; margin: 12px 16px; padding: 10px 14px; border-radius: 8px;
    background: var(--red-soft); color: var(--red); border: 1px solid #f3c9c9; font-size: 12.5px;
  }
  .error-banner.show { display: block; }
  .drop-active::after {
    content: "松开以导入 JSON 文件";
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600; color: var(--accent);
    background: rgba(232,240,254,.85); border: 3px dashed var(--accent); pointer-events: none;
  }

  /* ===== List title bar ===== */
  .list-title {
    display: none; align-items: center; padding: 8px 16px;
    background: #f5f7fa; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 13px; color: var(--text); flex: 0 0 auto;
  }
  .list-title.show { display: flex; }
  .list-title .list-count { margin-left: auto; font-size: 11px; font-weight: 400; color: var(--text-faint); }

  /* ===== Flat tree list ===== */
  .tree-scroll { flex: 1; overflow-y: auto; min-height: 0; padding: 6px 0 40px; }
  .tree-row {
    display: flex; align-items: center;
    min-height: 38px; padding: 0 22px 0 10px;
    border-bottom: 1px solid #eef1f5;
    cursor: default; transition: background .12s;
  }
  .tree-row:hover { background: #ddebff; }
  .tree-row.selected { background: #b6d1fb; box-shadow: inset 3px 0 0 var(--accent); }
  .tree-row.group { background: #f4f7fb; }
  .tree-row.group:hover { background: #edf2f9; }
  .tree-row.group.selected { background: #e2ecfb; }
  .indent { display: flex; align-self: stretch; flex: 0 0 auto; }
  .rail { width: 18px; border-left: 1px solid #dfe6ef; }
  .row-main { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
  .arrow {
    width: 16px; flex: 0 0 auto; text-align: center; color: var(--text-faint);
    font-size: 10px; user-select: none; cursor: pointer;
  }
  .arrow.leaf { visibility: hidden; }
  .row-icon { width: 16px; flex: 0 0 auto; text-align: center; font-size: 12px; }
  .row-name {
    flex: 0 1 auto; max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; cursor: pointer;
  }
  .row-name:hover { color: var(--accent); text-decoration: underline; }
  .tree-row.group .row-name { font-weight: 600; }
  .row-path {
    flex: 1; min-width: 0; font-size: 11px; color: var(--text-faint);
    font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row-path.action { color: var(--text-dim); }
  .copy-xpath {
    flex: 0 0 auto; border: 1px solid var(--border-strong); background: #fff;
    border-radius: 5px; font-size: 10px; line-height: 1; padding: 3px 7px;
    color: var(--text-dim); cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .tree-row:hover .copy-xpath, .tree-row.selected .copy-xpath { opacity: 1; }
  .copy-xpath:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .copy-xpath.copied { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .count { flex: 0 0 auto; margin-left: auto; font-size: 11px; color: var(--text-faint); font-weight: 400; white-space: nowrap; }
  .tag { flex: 0 0 auto; font-size: 10px; font-weight: 650; padding: 1px 6px; border-radius: 5px; }
  .tag.page { background: var(--purple-soft); color: var(--purple); }
  .tag.dialog { background: var(--amber-soft); color: var(--amber); }
  .tag.tab { background: var(--accent-soft); color: var(--accent); }
  .tag.collapse, .tag.group, .tag.ele { background: #eef1f4; color: var(--text-dim); }
  .tag.click { background: var(--accent-soft); color: var(--accent); }
  .tag.input { background: var(--green-soft); color: var(--green); }
  .tag.select { background: var(--purple-soft); color: var(--purple); }
  .tag.radio { background: var(--cyan-soft); color: var(--cyan); }
  .tag.date { background: var(--amber-soft); color: var(--amber); }
  .mark { background: #ffe9a8; border-radius: 2px; }
  .tree-hint { margin: 18px 16px; padding: 14px 16px; border: 1px dashed var(--border-strong); border-radius: 8px; color: var(--text-dim); font-size: 12.5px; line-height: 1.7; }

  /* ===== Detail drawer ===== */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 92vw);
    background: var(--panel); border-left: 1px solid var(--border);
    box-shadow: -8px 0 28px rgba(16,24,40,.14);
    transform: translateX(101%); transition: transform .2s ease;
    display: flex; flex-direction: column; z-index: 40;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  .drawer-head .head-main { flex: 1; min-width: 0; }
  .drawer-head h3 { font-size: 15px; font-weight: 650; word-break: break-all; display: inline; }
  .drawer-head .crumb { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; word-break: break-all; }
  .drawer-head .crumb .sep { color: var(--text-faint); margin: 0 3px; }
  .close-btn {
    border: 1px solid var(--border-strong); background: #fff; color: var(--text-dim);
    border-radius: 8px; width: 28px; height: 28px; font-size: 15px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .close-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }
  .drawer-body { flex: 1; overflow: auto; padding: 12px 14px 40px; }
  .drawer-placeholder { color: var(--text-faint); text-align: center; margin-top: 60px; }

  .card { border: 1px solid var(--border); border-radius: 8px; background: #fff; overflow: hidden; margin-top: 12px; }
  .card:first-child { margin-top: 0; }
  .card-head {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 9px 12px; border: none; border-bottom: 1px solid var(--border);
    background: #f7f9fc; font-size: 12px; font-weight: 650; color: var(--text);
  }
  .card-head:hover { background: #eef2f8; }
  .card-head .caret { font-size: 10px; color: var(--text-faint); transition: transform .12s; }
  .card-head .card-note { margin-left: auto; font-size: 11px; font-weight: 400; color: var(--text-faint); }
  .card.collapsed .card-head { border-bottom-color: transparent; }
  .card.collapsed .card-head .caret { transform: rotate(-90deg); }
  .card.collapsed .card-body { display: none; }
  .card-body { padding: 10px 12px; }
  .attr-list { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; }
  .attr-list .ak { color: var(--text-dim); font-family: var(--mono); font-size: 11.5px; }
  .attr-list .av { color: var(--accent); font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
  table.kv { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table.kv tr { border-bottom: 1px solid var(--border); }
  table.kv tr:last-child { border-bottom: none; }
  table.kv tr:nth-child(even) { background: #fafbfc; }
  table.kv td { padding: 6px 10px; vertical-align: top; font-size: 12px; }
  table.kv td.k { width: 128px; color: var(--text-dim); font-size: 11.5px; white-space: nowrap; }
  table.kv td.v { font-family: var(--mono); word-break: break-all; white-space: pre-wrap; }
  table.kv td.v.empty { color: var(--text-faint); font-style: italic; font-family: inherit; }
  .copyable { display: flex; align-items: flex-start; gap: 8px; }
  .copyable .txt { flex: 1; min-width: 0; word-break: break-all; }
  .copy { flex: 0 0 auto; border: 1px solid var(--border-strong); background: #fff; border-radius: 6px; font-size: 11px; padding: 3px 8px; color: var(--text-dim); }
  .copy:hover { border-color: var(--accent); color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #f2f4f7; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; font-family: var(--mono); }
  .attr-k { color: var(--text-dim); }
  .attr-v { color: var(--accent); }
  .mono-block { font-family: var(--mono); white-space: pre-wrap; word-break: break-all; font-size: 11.5px; }
  .net-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .net-table th { text-align: left; color: var(--text-dim); font-weight: 600; padding: 5px 8px; border-bottom: 1px solid var(--border); font-size: 11px; }
  .net-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .net-table tr:last-child td { border-bottom: none; }
  .net-table .url { font-family: var(--mono); word-break: break-all; }
  .method { font-weight: 700; font-size: 10.5px; }
  .status { font-weight: 700; }
  .status.ok { color: var(--green); }
  .status.warn { color: var(--amber); }
  .status.err { color: var(--red); }
  .hint { color: var(--text-faint); font-size: 12px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #cbd2da; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #aab3bd; background-clip: padding-box; border: 2px solid transparent; }
</style>
</head>
<body>
  <div class="header">
    <span class="logo">采集信息查看器</span>
    <input class="search" id="search" placeholder="搜索名称 / XPath / 取值…" disabled />
    <button class="hbtn" id="expandAll" disabled>全部展开</button>
    <button class="hbtn" id="collapseAll" disabled>全部折叠</button>
    <button class="hbtn primary" id="importBtn">导入 JSON</button>
    <input type="file" id="fileInput" accept=".json,application/json" multiple hidden />
  </div>

  <div class="summary" id="summary"></div>
  <div class="filetabs" id="fileTabs"></div>

  <main>
    <div class="list-title" id="listTitle">操作层级<span class="list-count" id="listCount"></span></div>
    <div class="error-banner" id="errorBanner"></div>
    <div class="tree-scroll" id="treeScroll" style="display:none"></div>
    <div class="empty" id="empty">
      <div class="big">&#128230;</div>
      <h2>导入采集信息</h2>
      <p>点击右上角「导入 JSON」，或将采集工具下载的 <code>.json</code> 文件拖拽到此处。支持同时导入多个文件，自动按 <code>propertiesID / propertiesPID</code> 还原分组与操作的层级结构。</p>
    </div>
  </main>

  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="head-main" id="drawerHead"></div>
      <button class="close-btn" id="drawerClose" title="关闭（Esc）">&#215;</button>
    </div>
    <div class="drawer-body" id="drawerBody">
      <div class="drawer-placeholder">点击左侧任意节点查看详细信息</div>
    </div>
  </aside>

<script>
(function () {
  "use strict";

  var GROUP_TYPES = {
    page:     { icon: "\u25A6", label: "页面" },
    dialog:   { icon: "\u25A3", label: "弹窗" },
    tab:      { icon: "\u25AD", label: "页签" },
    collapse: { icon: "\u25BE", label: "折叠面板" },
    group:    { icon: "\u25AB", label: "分组" }
  };
  var GROUP_ICON = "\u25A3";
  var ACTION_ICON = "\u25C6";
  var EVENT_CLASS = { click: "click", input: "input", select: "select", "select:click": "select", "select:tree": "select", radio: "radio", date: "date" };
  var EVENT_LABEL = { click: "点击", input: "输入", select: "下拉选择", "select:click": "下拉选择", "select:tree": "树形选择", radio: "单选", date: "日期", other: "其他" };

  var docs = [];
  var activeId = null;
  var selectedId = null;
  var collapsed = new Set();
  var searchTerm = "";

  function $(id) { return document.getElementById(id); }
  var elTreeScroll = $("treeScroll");
  var elSummary = $("summary");
  var elTabs = $("fileTabs");
  var elEmpty = $("empty");
  var elError = $("errorBanner");
  var elSearch = $("search");
  var elListTitle = $("listTitle");
  var elListCount = $("listCount");
  var elDrawer = $("drawer");
  var elDrawerHead = $("drawerHead");
  var elDrawerBody = $("drawerBody");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function hl(text) {
    var safe = esc(text);
    if (!searchTerm) return safe;
    var re = new RegExp("(" + searchTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    return safe.replace(re, '<span class="mark">$1</span>');
  }
  function fmtTime(ms) {
    if (!ms) return "\u2014";
    try { return new Date(ms).toLocaleString("zh-CN", { hour12: false }); } catch (e) { return String(ms); }
  }
  function fmtDuration(a, b) {
    if (!a || !b) return "\u2014";
    var s = Math.max(0, Math.round((b - a) / 1000));
    if (s < 60) return s + " 秒";
    return Math.floor(s / 60) + " 分 " + (s % 60) + " 秒";
  }
  function uid() { return "d" + Math.random().toString(36).slice(2, 9); }
  function eventLabel(ev) { return EVENT_LABEL[ev] || ev || "其他"; }

  // ---------------- Parse & tree ----------------
  function extract(raw) {
    if (Array.isArray(raw)) return { list: raw, meta: {} };
    if (raw && Array.isArray(raw.transcationProperties)) return { list: raw.transcationProperties, meta: raw };
    if (raw && raw.data && Array.isArray(raw.data.transcationProperties)) return { list: raw.data.transcationProperties, meta: raw.data };
    if (raw && Array.isArray(raw.elements)) return { list: raw.elements, meta: raw };
    return { list: [], meta: raw && typeof raw === "object" ? raw : {} };
  }

  function buildTree(list) {
    var nodes = list.map(function (n, i) {
      var c = Object.assign({}, n);
      c.__index = i;
      c.__children = [];
      c.__parent = null;
      c.__id = (n.propertiesID != null && n.propertiesID !== "") ? String(n.propertiesID) : "__idx" + i;
      if (c.type == null) c.type = (n.xpath || n.target) ? "ele" : "group";
      return c;
    });
    var byId = {};
    nodes.forEach(function (n) { byId[n.__id] = n; });

    var roots = [];
    nodes.forEach(function (n) {
      var pid = n.propertiesPID;
      if (pid == null || pid === "" || !byId[String(pid)] || String(pid) === n.__id) {
        roots.push(n);
      } else {
        var p = byId[String(pid)];
        p.__children.push(n);
        n.__parent = p;
      }
    });

    (function sortRec(arr) {
      arr.sort(function (a, b) {
        var sa = (typeof a.seq === "number") ? a.seq : null;
        var sb = (typeof b.seq === "number") ? b.seq : null;
        if (sa != null && sb != null && sa !== sb) return sa - sb;
        return a.__index - b.__index;
      });
      arr.forEach(function (n) { sortRec(n.__children); });
    })(roots);

    var stats = { total: nodes.length, groups: 0, actions: 0, network: 0, linked: 0 };
    nodes.forEach(function (n) {
      if (isAction(n)) {
        stats.actions++;
        if (Array.isArray(n.networkCalls)) stats.network += n.networkCalls.length;
      } else stats.groups++;
      if (n.__parent) stats.linked++;
    });

    // 每个分组统计其下操作数量，供分组标题展示，与录制列表风格一致。
    (function countRec(list2) {
      list2.forEach(function (n) {
        if (isAction(n)) { n.__count = 1; return; }
        var c = 0;
        n.__children.forEach(function (ch) { countRec([ch]); c += ch.__count || 0; });
        n.__count = c;
      });
    })(roots);

    return { roots: roots, byId: byId, nodes: nodes, stats: stats };
  }

  function isAction(n) { return n.type === "ele" || n.type === "target"; }
  function nodeName(n) { return n.propertiesName || n.realLabel || n.tagName || (isAction(n) ? "元素" : "分组"); }
  function groupInfo(type) { return GROUP_TYPES[type] || GROUP_TYPES.group; }
  function stripInternal(n) {
    var out = {};
    Object.keys(n).forEach(function (k) { if (k.indexOf("__") !== 0) out[k] = n[k]; });
    return out;
  }
  function activeDoc() {
    for (var i = 0; i < docs.length; i++) if (docs[i].id === activeId) return docs[i];
    return docs[0] || null;
  }

  // ---------------- Import ----------------
  function readFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var pending = files.length;
    files.forEach(function (file) {
      var reader = new FileReader();
      reader.onload = function () {
        try { addDoc(file.name, JSON.parse(reader.result)); }
        catch (e) { showError("解析失败：" + file.name + " — " + e.message); }
        if (--pending === 0) renderAll();
      };
      reader.onerror = function () {
        showError("读取失败：" + file.name);
        if (--pending === 0) renderAll();
      };
      reader.readAsText(file, "utf-8");
    });
  }

  function addDoc(filename, raw) {
    var parsed = extract(raw);
    var tree = buildTree(parsed.list);
    docs.push({
      id: uid(), filename: filename, meta: parsed.meta || {}, raw: raw,
      nodes: tree.nodes, roots: tree.roots, byId: tree.byId, stats: tree.stats
    });
    activeId = docs[docs.length - 1].id;
    selectedId = null;
    collapsed = new Set();
    searchTerm = "";
    elSearch.value = "";
  }

  function showError(msg) { elError.textContent = msg; elError.classList.add("show"); }

  // ---------------- Render ----------------
  function renderAll() {
    try {
      elError.classList.remove("show");
      renderTabs();
      var doc = activeDoc();
      var has = !!(doc && doc.nodes.length);
      elEmpty.style.display = has ? "none" : "flex";
      elTreeScroll.style.display = has ? "block" : "none";
      elSummary.classList.toggle("show", has);
      elListTitle.classList.toggle("show", has);
      [elSearch, $("expandAll"), $("collapseAll")].forEach(function (el) { el.disabled = !has; });
      if (!has) { closeDrawer(); return; }
      renderSummary();
      renderTree();
      renderDetail();
    } catch (e) {
      showError("渲染出错：" + e.message);
      if (window.console) console.error(e);
    }
  }

  function renderTabs() {
    elTabs.innerHTML = "";
    docs.forEach(function (doc) {
      var tab = document.createElement("button");
      tab.className = "filetab" + (doc.id === activeId ? " active" : "");
      var result = (doc.meta && doc.meta.result) || "";
      var color = result === "pass" ? "var(--green)" : result === "fail" ? "var(--red)" : result === "interrupted" ? "var(--amber)" : "var(--text-faint)";
      tab.innerHTML = '<span class="dot" style="background:' + color + '"></span><span>' + esc(doc.filename) + '</span><span class="close" title="移除">&#215;</span>';
      tab.addEventListener("click", function (e) {
        if (e.target.classList.contains("close")) {
          docs = docs.filter(function (d) { return d.id !== doc.id; });
          if (activeId === doc.id) activeId = docs.length ? docs[0].id : null;
          selectedId = null;
          renderAll();
          return;
        }
        if (activeId === doc.id) return;
        activeId = doc.id;
        selectedId = null;
        collapsed = new Set();
        searchTerm = "";
        elSearch.value = "";
        closeDrawer();
        renderAll();
      });
      elTabs.appendChild(tab);
    });
  }

  function renderSummary() {
    var doc = activeDoc(), m = doc.meta, s = doc.stats;
    var parts = [];
    if (m.result) {
      var cls = m.result === "pass" ? "pass" : m.result === "fail" ? "fail" : m.result === "interrupted" ? "interrupted" : "neutral";
      var label = m.result === "pass" ? "通过" : m.result === "fail" ? "不通过" : m.result === "interrupted" ? "中断" : m.result;
      parts.push('<span class="badge ' + cls + '">' + esc(label) + "</span>");
    }
    var title = (m.targetTab && m.targetTab.title) || "";
    if (title) parts.push('<span class="item">' + esc(title) + "</span>");
    var url = (m.targetTab && m.targetTab.url) || m.url || "";
    if (url) parts.push('<span class="item url" title="' + esc(url) + '">' + esc(url) + "</span>");
    if (m.startedAt) parts.push('<span class="item">' + esc(fmtTime(m.startedAt)) + " · " + esc(fmtDuration(m.startedAt, m.endedAt)) + "</span>");
    parts.push('<span class="item">分组 <b>' + s.groups + "</b></span>");
    parts.push('<span class="item">操作 <b>' + s.actions + "</b></span>");
    if (s.network) parts.push('<span class="item">接口 <b>' + s.network + "</b></span>");
    elSummary.innerHTML = parts.join("");
  }

  // ---------------- Trees (flatten + indent) ----------------
  function nodeMatches(n, term) {
    if (!term) return true;
    var hay = [n.propertiesName, n.realLabel, n.xpath, n.target, n.objectValue, n.tagName, n.eventTypeName, n.eventTypeValue, n.key, n.url]
      .join(" ").toLowerCase();
    return hay.indexOf(term) !== -1;
  }
  function subtreeMatches(n, term) {
    if (!term) return true;
    if (nodeMatches(n, term)) return true;
    return n.__children.some(function (c) { return subtreeMatches(c, term); });
  }

  function visibleRows(doc, term) {
    var rows = [];
    (function walk(list, depth) {
      list.forEach(function (n) {
        var action = isAction(n);
        if (action) {
          if (!term || nodeMatches(n, term)) rows.push({ node: n, depth: depth, action: true });
          return;
        }
        if (term && !subtreeMatches(n, term)) return;
        rows.push({ node: n, depth: depth, action: false });
        if (!collapsed.has(n.__id) || term) walk(n.__children, depth + 1);
      });
    })(doc.roots, 0);
    return rows;
  }

  function renderTree() {
    var doc = activeDoc();
    if (!doc) return;
    var term = searchTerm.toLowerCase();
    var rows = visibleRows(doc, term);

    if (!rows.length) {
      var msg = term ? '没有匹配「' + esc(searchTerm) + '」的节点' : "没有可显示的节点";
      elTreeScroll.innerHTML = '<div class="tree-hint">' + msg + "</div>";
      elListCount.textContent = "";
      return;
    }

    var html = rows.map(function (r) { return r.action ? actionRow(r.node, r.depth) : groupRow(r.node, r.depth); }).join("");

    if (doc.nodes.length > 1 && doc.stats.linked === 0) {
      html = '<div class="tree-hint">未在数据中找到 <code>propertiesPID</code> 父子关联，已按扁平层级显示。请确认导入的是采集工具下载的 JSON。</div>' + html;
    }
    elTreeScroll.innerHTML = html;

    var shownGroups = rows.filter(function (r) { return !r.action; }).length;
    elListCount.textContent = rows.length + " 行 · 分组 " + shownGroups;
  }

  function indentHtml(depth) {
    if (!depth) return "";
    var s = "";
    for (var i = 0; i < depth; i++) s += '<span class="rail"></span>';
    return '<span class="indent">' + s + "</span>";
  }

  function groupRow(n, depth) {
    var gi = groupInfo(n.type);
    var isCollapsed = collapsed.has(n.__id);
    return '<div class="tree-row group' + (n.__id === selectedId ? " selected" : "") + '" data-id="' + esc(n.__id) + '" data-group="1">' +
      indentHtml(depth) +
      '<div class="row-main">' +
        '<span class="arrow" data-toggle="' + esc(n.__id) + '">' + (isCollapsed ? "\u25B8" : "\u25BE") + "</span>" +
        '<span class="row-icon">' + GROUP_ICON + "</span>" +
        '<span class="row-name" title="点击查看详情">' + hl(nodeName(n)) + "</span>" +
        '<span class="tag ' + (GROUP_TYPES[n.type] ? n.type : "group") + '">' + esc(gi.label) + "</span>" +
        '<span class="count">' + (n.__count || 0) + " 条</span>" +
      "</div>" +
      "</div>";
  }

  function actionRow(n, depth) {
    var sub = n.xpath || n.target || "";
    var netCount = Array.isArray(n.networkCalls) ? n.networkCalls.length : 0;
    return '<div class="tree-row action' + (n.__id === selectedId ? " selected" : "") + '" data-id="' + esc(n.__id) + '">' +
      indentHtml(depth) +
      '<div class="row-main">' +
        '<span class="arrow leaf">\u25BE</span>' +
        '<span class="row-icon">' + ACTION_ICON + "</span>" +
        '<span class="row-name" title="点击查看详情">' + hl(nodeName(n)) + "</span>" +
        '<span class="tag ' + (EVENT_CLASS[n.eventTypeValue] || "ele") + '">' + esc(n.eventTypeName || eventLabel(n.eventTypeValue)) + "</span>" +
        '<span class="row-path action" title="' + esc(sub) + '">' + (sub ? hl(sub) : "") + "</span>" +
        (netCount ? '<span class="count">' + netCount + " 接口</span>" : "") +
        (sub ? '<button type="button" class="copy-xpath" data-copy="' + esc(sub) + '" title="复制 XPath">复制</button>' : "") +
      "</div>" +
      "</div>";
  }

  // ---------------- Detail drawer ----------------
  function openDrawer() { elDrawer.classList.add("open"); }
  function closeDrawer() {
    elDrawer.classList.remove("open");
    selectedId = null;
    var sel = elTreeScroll.querySelector(".tree-row.selected");
    if (sel) sel.classList.remove("selected");
  }

  function renderDetail() {
    var doc = activeDoc();
    var n = doc && selectedId ? doc.byId[selectedId] : null;
    if (!n) {
      elDrawerHead.innerHTML = "";
      elDrawerBody.innerHTML = '<div class="drawer-placeholder">点击左侧任意节点查看详细信息</div>';
      return;
    }
    var action = isAction(n);
    var type = action ? "ele" : (n.type || "group");
    var gi = groupInfo(type);

    var chain = [], cur = n;
    while (cur) { chain.unshift(cur); cur = cur.__parent; }
    var crumb = chain.map(function (c, i) {
      return (i ? '<span class="sep">\u203A</span>' : "") + esc(nodeName(c));
    }).join("");

    elDrawerHead.innerHTML =
      "<h3>" + esc(nodeName(n)) + "</h3>" +
      (action
        ? ' <span class="tag ' + (EVENT_CLASS[n.eventTypeValue] || "ele") + '">' + esc(n.eventTypeName || eventLabel(n.eventTypeValue)) + "</span>"
        : ' <span class="tag ' + (GROUP_TYPES[type] ? type : "group") + '">' + esc(gi.label) + "</span>") +
      '<div class="crumb">' + crumb + "</div>";

    var body = "";
    var xpath = action ? (n.xpath || n.target || "") : "";
    if (xpath) {
      body += card("定位路径", '<div class="copyable"><span class="txt mono-block">' + esc(xpath) + '</span><button class="copy" data-copy="' + esc(xpath) + '">复制</button></div>');
    }

    if (action && n.attributes && typeof n.attributes === "object" && Object.keys(n.attributes).length) {
      var attrKeys = Object.keys(n.attributes);
      var attrRows = attrKeys.map(function (k) {
        return '<span class="ak">' + esc(k) + '</span><span class="av">' + esc(n.attributes[k]) + "</span>";
      }).join("");
      body += card("元素属性", '<div class="attr-list">' + attrRows + "</div>", attrKeys.length + " 项");
    }

    var extras = extraFields(n);
    if (extras.length) body += card("其他字段", kvTable(extras));

    if (action && Array.isArray(n.networkCalls)) {
      body += n.networkCalls.length
        ? card("关联接口调用", netTable(n.networkCalls, n.timestamp), n.networkCalls.length + " 条")
        : card("关联接口调用", '<div class="hint">无</div>');
    }

    body += card("原始节点 JSON",
      '<div class="copyable"><span class="txt mono-block">' + esc(JSON.stringify(stripInternal(n), null, 2)) + '</span><button class="copy" data-copy-json="1">复制</button></div>');

    elDrawerBody.innerHTML = body;
    elDrawerBody.scrollTop = 0;
    openDrawer();
  }

  function card(title, html, note) {
    return '<div class="card">' +
      '<button type="button" class="card-head">' +
        '<span class="caret">\u25BE</span>' +
        "<span>" + esc(title) + "</span>" +
        (note ? '<span class="card-note">' + esc(note) + "</span>" : "") +
      "</button>" +
      '<div class="card-body">' + html + "</div>" +
      "</div>";
  }
  function kvTable(rows) {
    return "<table class='kv'>" + rows.map(function (r) {
      var v = r[1], empty = v === undefined || v === null || v === "";
      return "<tr><td class='k'>" + esc(r[0]) + "</td><td class='v" + (empty ? " empty" : "") + "'>" + esc(empty ? "\u2014" : v) + "</td></tr>";
    }).join("") + "</table>";
  }
  function extraFields(n) {
    var known = {
      propertiesID: 1, propertiesPID: 1, type: 1, propertiesName: 1, clientId: 1, seq: 1, timestamp: 1,
      eventTypeValue: 1, eventTypeName: 1, xpath: 1, target: 1, mothed: 1, transcationType: 1, tagName: 1,
      realLabel: 1, objectValue: 1, options: 1, attributes: 1, frameId: 1, networkCalls: 1, key: 1, url: 1
    };
    return Object.keys(n).filter(function (k) { return k.indexOf("__") !== 0 && !known[k]; })
      .map(function (k) { var v = n[k]; return [k, typeof v === "object" && v !== null ? JSON.stringify(v) : v]; });
  }
  function statusClass(code) {
    if (code >= 200 && code < 300) return "ok";
    if (code >= 300 && code < 400) return "warn";
    return "err";
  }
  function netTable(calls, baseTs) {
    var rows = calls.map(function (c) {
      var delta = (baseTs != null && c.timestamp != null) ? " (+" + (c.timestamp - baseTs) + " ms)" : "";
      var status = c.statusCode != null ? '<span class="status ' + statusClass(c.statusCode) + '">' + c.statusCode + "</span>" : "\u2014";
      return "<tr><td class='method'>" + esc(c.method || "\u2014") + "</td><td>" + status + "</td><td class='url'>" + esc(c.url || "") + "</td></tr>";
    }).join("");
    return "<table class='net-table'><thead><tr><th>方法</th><th>状态</th><th>URL</th></tr></thead><tbody>" + rows + "</tbody></table>";
  }

  // ---------------- Interactions ----------------
  elTreeScroll.addEventListener("click", function (e) {
    var row = e.target.closest(".tree-row");
    if (!row) return;

    var copyBtn = e.target.closest(".copy-xpath");
    if (copyBtn) {
      e.preventDefault();
      copyText(copyBtn.getAttribute("data-copy") || "");
      copyBtn.textContent = "已复制";
      copyBtn.classList.add("copied");
      setTimeout(function () { copyBtn.textContent = "复制"; copyBtn.classList.remove("copied"); }, 1000);
      return;
    }

    var arrow = e.target.closest(".arrow");
    if (arrow && row.getAttribute("data-group")) {
      var tid = arrow.getAttribute("data-toggle");
      if (collapsed.has(tid)) collapsed.delete(tid); else collapsed.add(tid);
      renderTree();
      return;
    }

    if (!e.target.closest(".row-name")) return;
    selectedId = row.getAttribute("data-id");
    var prev = elTreeScroll.querySelector(".tree-row.selected");
    if (prev) prev.classList.remove("selected");
    row.classList.add("selected");
    renderDetail();
  });

  elDrawerBody.addEventListener("click", function (e) {
    var head = e.target.closest(".card-head");
    if (head) {
      head.closest(".card").classList.toggle("collapsed");
      return;
    }
    var btn = e.target.closest(".copy");
    if (!btn) return;
    var text = btn.getAttribute("data-copy");
    if (text == null && btn.hasAttribute("data-copy-json")) {
      var doc = activeDoc(), n = doc && doc.byId[selectedId];
      text = n ? JSON.stringify(stripInternal(n), null, 2) : "";
    }
    copyText(text || "");
    var old = btn.textContent;
    btn.textContent = "已复制";
    setTimeout(function () { btn.textContent = old; }, 1000);
  });

  $("drawerClose").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDrawer();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "o") { e.preventDefault(); $("fileInput").click(); }
  });

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { legacyCopy(text); });
    } else legacyCopy(text);
  }
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  elSearch.addEventListener("input", function () {
    searchTerm = elSearch.value.trim();
    renderTree();
  });
  $("expandAll").addEventListener("click", function () { collapsed = new Set(); renderTree(); });
  $("collapseAll").addEventListener("click", function () {
    var doc = activeDoc(); if (!doc) return;
    collapsed = new Set();
    doc.nodes.forEach(function (n) { if (n.__children.length) collapsed.add(n.__id); });
    renderTree();
  });

  $("importBtn").addEventListener("click", function () { $("fileInput").click(); });
  $("fileInput").addEventListener("change", function (e) { readFiles(e.target.files); e.target.value = ""; });

  var dragDepth = 0;
  window.addEventListener("dragenter", function (e) { e.preventDefault(); dragDepth++; document.body.classList.add("drop-active"); });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("dragleave", function (e) { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("drop-active"); } });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove("drop-active");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) readFiles(e.dataTransfer.files);
  });

  renderAll();
})();
</script>
</body>
</html>
